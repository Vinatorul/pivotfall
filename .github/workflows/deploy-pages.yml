name: Godot CI and Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.6.1-stable
  GODOT_TEMPLATE_VERSION: 4.6.1.stable
  GODOT_EDITOR_ARCHIVE: Godot_v4.6.1-stable_linux.x86_64.zip
  GODOT_EDITOR_SHA512: a76fd0fe1d44a2dd6c065b6f7b434ad75f5593c07bda3d3017f8304f2d069acbcf0f39cb5d0976f0434b56e9ea852032ddbcbdb7e0ce1c75a47e1dacb6794bd7
  GODOT_TEMPLATES_ARCHIVE: Godot_v4.6.1-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA512: d80001711c07973b1fd3e88077ba99644e19db7c9e52627e16f38a2937879f809f94dbd8493936fb8204908bbc57a521d41173dce5208061fe4c99772490c541

permissions: {}

concurrency:
  group: pivotfall-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Smoke tests and Web export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare log directory
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/builds/logs/smoke"

      - name: Restore Godot editor archive
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pivotfall/${{ env.GODOT_EDITOR_ARCHIVE }}
          key: godot-editor-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-${{ env.GODOT_EDITOR_SHA512 }}

      - name: Download Godot editor archive
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/pivotfall"
          mkdir -p "$cache_dir"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$cache_dir/$GODOT_EDITOR_ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/$GODOT_EDITOR_ARCHIVE"

      - name: Install Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="$HOME/.cache/pivotfall/$GODOT_EDITOR_ARCHIVE"
          install_dir="$RUNNER_TEMP/godot"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA512" "$archive" | \
            sha512sum --check -
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/${GODOT_EDITOR_ARCHIVE%.zip}"
          ln -s "$install_dir/${GODOT_EDITOR_ARCHIVE%.zip}" \
            "$install_dir/godot"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"
          "$install_dir/godot" --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          log_file="$GITHUB_WORKSPACE/builds/logs/project-import.log"
          if timeout --signal=TERM --kill-after=10s 5m \
            godot \
              --headless \
              --path "$GITHUB_WORKSPACE" \
              --log-file "$log_file" \
              --import; then
            status=0
          else
            status=$?
          fi
          if (( status != 0 )); then
            echo "::error title=Godot import failed::Godot exited with status $status"
            exit "$status"
          fi
          if [[ ! -s "$log_file" ]]; then
            echo '::error title=Godot import failed::Import log is missing or empty'
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|Failed to load script' "$log_file"; then
            echo '::error title=Godot import failed::Import log contains a script/load error'
            exit 1
          fi

      - name: Run smoke suite
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/godot
          SMOKE_LOG_DIR: ${{ github.workspace }}/builds/logs/smoke
          SMOKE_TEST_TIMEOUT_SECONDS: "300"
        run: bash tests/run_smoke_tests.sh

      - name: Restore Web export template
        id: templates-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}
          key: godot-web-template-${{ runner.os }}-${{ env.GODOT_RELEASE }}-${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Install Web export template
        if: steps.templates-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$GODOT_TEMPLATES_ARCHIVE"
          target="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/$GODOT_TEMPLATES_ARCHIVE"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA512" "$archive" | \
            sha512sum --check -
          mkdir -p "$target"
          unzip -jo "$archive" \
            templates/web_nothreads_release.zip \
            templates/version.txt \
            -d "$target"

      - name: Export Web release
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/builds/web"
          output="$output_dir/index.html"
          log_file="$GITHUB_WORKSPACE/builds/logs/web-export.log"
          mkdir -p "$output_dir"
          if timeout --signal=TERM --kill-after=10s 10m \
            godot \
              --headless \
              --path "$GITHUB_WORKSPACE" \
              --log-file "$log_file" \
              --export-release Web \
              "$output"; then
            status=0
          else
            status=$?
          fi
          if (( status != 0 )); then
            echo "::error title=Web export failed::Godot exited with status $status"
            exit "$status"
          fi
          if [[ ! -s "$log_file" ]]; then
            echo '::error title=Web export failed::Export log is missing or empty'
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|Failed to load script' "$log_file"; then
            echo '::error title=Web export failed::Export log contains a script/load error'
            exit 1
          fi
          for required_file in index.html index.js index.pck index.wasm; do
            if [[ ! -s "$output_dir/$required_file" ]]; then
              echo "::error title=Web export failed::Missing builds/web/$required_file"
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: builds/web

      - name: Upload Godot logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: builds/logs
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
